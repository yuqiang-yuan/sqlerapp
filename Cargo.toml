[package]
name = "sqlerapp"
version = "0.1.0"
edition = "2024"

[lib]
name = "sqlerapp"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
gpui-kit = "0.6"
rust-embed = "8.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.26.0", features = ["v4"] }
